services:
  mongodb:
    image: mongo:7
    container_name: cv-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cv
    volumes:
      - cv-mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: cv-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: cv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - cv-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cv"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: cv-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv-springboot
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PORT: 8080
      MONGODB_URI: mongodb://mongodb:27017/cv
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: cv
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_STARTTLS: "false"
      SHOULD_INIT: "true"
      INIT_PASSWORD: "123456"
      JWT_ACCESS_TOKEN_SECRET: change-me-access-secret-change-me-access-secret
      JWT_REFRESH_TOKEN_SECRET: change-me-refresh-secret-change-me-refresh-secret
      UPLOAD_DIR: /app/data/images
    volumes:
      - cv-upload-data:/app/data/images

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:8081
    container_name: cv-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "3000:80"

volumes:
  cv-mongodb-data:
  cv-postgres-data:
  cv-upload-data:
